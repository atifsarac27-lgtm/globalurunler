name: Yeni Ürün Radarı

# "Run workflow" düğmesiyle elle başlatılır. Kendiliğinden çalışmaz.
on:
  workflow_dispatch:
    inputs:
      gun:
        description: "Kaç günlük dönem taransın? (2 ay = 60)"
        default: "60"
      sadece_rapor:
        description: "Yalnızca raporu yeniden kur (Gemini çağrısı yok, ücretsiz). Top ve yorum dosyalarını güncelledikten sonra kullanın."
        type: choice
        options: ["hayir", "evet"]
        default: "hayir"
      kapsam:
        description: "Kaç site taransın? deneme-12 (12 site, en çok 20 çağrı) · buyuk-50 (büyük pazarlar, en çok 130 çağrı) · hepsi (134 site, en çok 260 çağrı)"
        type: choice
        options: ["deneme-12", "buyuk-50", "hepsi"]
        default: "hepsi"
      max_usd:
        description: "Bu çalışmada en çok tahmini harcama (dolar). Dolunca durur."
        default: "8"

permissions:
  contents: write   # arşivi, son ekran görüntülerini ve son rapor verisini depoya kaydetmek için

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Dosyaları al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tarayıcıyı kur
        run: |
          pip install playwright==1.49.1 openpyxl pillow pypdf
          playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-cjk

      - name: Radarı çalıştır
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DONEM_GUN: ${{ inputs.gun }}
          MAX_USD: ${{ inputs.max_usd }}
          RESMI_MOD: "1"
          MAX_SITE: ${{ inputs.kapsam == 'deneme-12' && '12' || inputs.kapsam == 'buyuk-50' && '50' || '0' }}
          MAX_CAGRI: ${{ inputs.kapsam == 'deneme-12' && '20' || inputs.kapsam == 'buyuk-50' && '130' || '260' }}
          SADECE_RAPOR: ${{ inputs.sadece_rapor == 'evet' && '1' || '0' }}
          EKRAN_KOPYALA: "1"
          VERI_KOPYALA: "1"
          PARALEL: "8"
        run: python radar.py

      - name: Haber katmanı (kaynak zinciri)
        if: always()
        continue-on-error: true
        run: mkdir -p rapor && python kaynak_zinciri.py --veri arsiv/son-veri.json --cikti rapor/kaynak_sonuc.json

      - name: Haber başlıklarını sınıflandır (Gemini)
        if: always()
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_CAGRI: "12"
        run: python yeni_urun_siniflandir.py --sonuc rapor/kaynak_sonuc.json --cikti rapor/haber_urunleri.json

      - name: Resmi ve haber sonuçlarını birleştir
        if: always()
        continue-on-error: true
        run: python birlestir.py --veri rapor/veri.json --haber rapor/haber_urunleri.json --cikti rapor/birlesik.xlsx

      - name: Birleşik PDF raporu üret
        if: always()
        continue-on-error: true
        env:
          DONEM_GUN: ${{ inputs.gun }}
        run: python birlestir_pdf.py --veri rapor/veri.json --haber rapor/haber_urunleri.json --cikti rapor/birlesik_rapor.pdf

      - name: PDF raporları yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PDF-rapor
          path: |
            rapor/rapor.pdf
            rapor/ozet.pdf
            rapor/birlesik_rapor.pdf
          retention-days: 90

      - name: Tüm rapor dosyalarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yeni-urun-raporu
          path: rapor/
          retention-days: 90

      - name: Arşivi depoya kaydet
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          for d in arsiv son-ekran son-gorseller; do
            if [ -e "$d" ]; then git add "$d"; fi
          done
          if git diff --cached --quiet; then
            echo "Kaydedilecek değişiklik yok."
          else
            git commit -m "Arşiv güncellendi"
            git push
          fi
