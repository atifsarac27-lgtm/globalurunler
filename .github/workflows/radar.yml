name: Yeni Ürün Radarı

# "Run workflow" düğmesiyle elle başlatılır. Kendiliğinden çalışmaz.
on:
  workflow_dispatch:
    inputs:
      gun:
        description: "Kaç günlük dönem taransın? (2 ay = 60)"
        default: "60"
      sadece_rapor:
        description: "Yalnızca raporu yeniden kur (Gemini çağrısı yok, ücretsiz). Top ve yorum dosyalarını güncelledikten sonra kullanın."
        type: choice
        options: ["hayir", "evet"]
        default: "hayir"
      max_usd:
        description: "Bu çalışmada en çok tahmini harcama (dolar). Dolunca durur."
        default: "18"

permissions:
  contents: write   # arşivi, son ekran görüntülerini ve son rapor verisini depoya kaydetmek için

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Dosyaları al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tarayıcıyı kur
        run: |
          pip install playwright==1.49.1 openpyxl pillow pypdf
          playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-cjk

      - name: Radarı çalıştır
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DONEM_GUN: ${{ inputs.gun }}
          MAX_USD: ${{ inputs.max_usd }}
          SADECE_RAPOR: ${{ inputs.sadece_rapor == 'evet' && '1' || '0' }}
          EKRAN_KOPYALA: "1"
          VERI_KOPYALA: "1"
          PARALEL: "8"
        run: python radar.py

      - name: PDF raporları yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PDF-rapor
          path: |
            rapor/rapor.pdf
            rapor/ozet.pdf
          retention-days: 90

      - name: Tüm rapor dosyalarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yeni-urun-raporu
          path: rapor/
          retention-days: 90

      - name: Arşivi depoya kaydet
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          for d in arsiv son-ekran son-gorseller; do
            if [ -e "$d" ]; then git add "$d"; fi
          done
          if git diff --cached --quiet; then
            echo "Kaydedilecek değişiklik yok."
          else
            git commit -m "Arşiv güncellendi"
            git push
          fi
