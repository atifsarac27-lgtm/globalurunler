name: Yeni Ürün Radarı

# "Run workflow" düğmesiyle elle başlatılır. Kendiliğinden çalışmaz.
on:
  workflow_dispatch:
    inputs:
      gun:
        description: "Kaç günlük dönem taransın? (2 ay = 60)"
        default: "60"

permissions:
  contents: write   # arşivi ve son ekran görüntülerini depoya kaydetmek için

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Dosyaları al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tarayıcıyı kur
        run: |
          pip install playwright==1.49.1 openpyxl pillow
          playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-cjk

      - name: Radarı çalıştır
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DONEM_GUN: ${{ inputs.gun }}
          EKRAN_KOPYALA: "1"
        run: python radar.py

      - name: PDF raporu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PDF-rapor
          path: rapor/rapor.pdf
          retention-days: 90

      - name: Tüm rapor dosyalarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yeni-urun-raporu
          path: rapor/
          retention-days: 90

      - name: Arşivi depoya kaydet
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add arsiv son-ekran 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Kaydedilecek değişiklik yok."
          else
            git commit -m "Arşiv güncellendi"
            git push
          fi
