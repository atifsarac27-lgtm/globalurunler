name: Foto denemesi

# Elle başlatılır. Birkaç markanın sitesinden ürün adı ve fotoğraf denemesi yapar. Gemini kullanmaz.
on:
  workflow_dispatch:

permissions:
  contents: write   # sonucu ayrı bir dala (foto-denemesi) yazmak için

jobs:
  deneme:
    runs-on: ubuntu-24.04  # ubuntu-latest 19 Ekim 2026'da Ubuntu 26'ya geçiyor; ortamı sabitliyoruz
    timeout-minutes: 60
    steps:
      - name: Dosyaları al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tarayıcıyı kur
        run: |
          pip install playwright==1.49.1
          playwright install --with-deps chromium

      - name: Siteleri tara
        run: |
          python - <<'PY' > siteler.txt
          import json
          d = json.load(open("arsiv/son-veri.json", encoding="utf-8"))
          kodlar = ["kfc-tr", "bk-tr", "pop-tr", "mcd-tr", "sbr-tr", "sub-tr", "arb-tr",
                    "kfc-us", "bk-us", "pop-us", "mcd-us", "sbr-us", "sub-us", "arb-us"]
          adresler = {s["kod"]: s.get("adres") for s in d["siteler"]}
          for k in kodlar:
              if adresler.get(k):
                  print(k, adresler[k])
          PY
          cat siteler.txt
          while read kod adres; do
            python foto_denemesi.py --adres "$adres" --kok "denemeler/$kod" || true
          done < siteler.txt

      - name: Sonucu foto-denemesi dalına kaydet
        if: always()
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git checkout -q -B foto-denemesi
          git add -f denemeler
          git commit -q -m "Foto denemesi sonucu" || echo "Değişiklik yok"
          git push -q -f origin foto-denemesi

      - name: Özet
        if: always()
        run: |
          for f in denemeler/*/sonuc.json; do
            [ -f "$f" ] && { echo "### $f"; cat "$f"; echo; } >> "$GITHUB_STEP_SUMMARY"
          done
