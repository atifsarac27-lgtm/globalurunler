name: Haber görseli testi

# Elle başlatılır. Gemini kullanmaz; birkaç haber bağlantısında görsel çekmeyi dener.
on:
  workflow_dispatch:

permissions:
  contents: write   # sonucu test_sonuc/ klasörüne kaydetmek için

jobs:
  deneme:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Dosyaları al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağlantı çözücüyü kur
        continue-on-error: true
        run: pip install googlenewsdecoder "selectolax<1.0"

      - name: Haber adaylarını topla
        run: mkdir -p rapor && python kaynak_zinciri.py --veri arsiv/son-veri.json --cikti rapor/kaynak_sonuc.json --limit 40

      - name: Görsel testini çalıştır
        run: python haber_gorsel_testi.py --kaynak rapor/kaynak_sonuc.json --cikti rapor/gorsel_testi.md --adet 10

      - name: Sonucu özet olarak göster
        if: always()
        run: |
          if [ -f rapor/gorsel_testi.md ]; then cat rapor/gorsel_testi.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Sonucu depoya kaydet
        if: always()
        run: |
          if [ -f rapor/gorsel_testi.md ]; then mkdir -p test_sonuc && cp rapor/gorsel_testi.md test_sonuc/; fi
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add test_sonuc
          if git diff --cached --quiet; then
            echo "Kaydedilecek sonuç yok."
          else
            git commit -m "Görsel testi sonucu"
            git pull -q --rebase
            git push -q
          fi

      - name: Sonucu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gorsel-testi
          path: rapor/gorsel_testi.md
          retention-days: 14
