name: Foto denemesi

# Elle başlatılır. Tek marka sitesinden ürün adı ve fotoğraf denemesi yapar. Gemini kullanmaz.
on:
  workflow_dispatch:

permissions:
  contents: write   # sonucu ayrı bir dala (foto-denemesi) yazmak için

jobs:
  deneme:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Dosyaları al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Deneme sitesini tara
        run: python foto_denemesi.py --adres https://www.kfcturkiye.com/ --kok rapor/foto_deneme

      - name: Sonucu foto-denemesi dalına kaydet
        if: always()
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git checkout -q -B foto-denemesi
          mkdir -p denemeler && rm -rf denemeler/* && cp -r rapor/foto_deneme/. denemeler/
          git add -f denemeler
          git commit -q -m "Foto denemesi sonucu" || echo "Değişiklik yok"
          git push -q -f origin foto-denemesi

      - name: Özet
        if: always()
        run: |
          if [ -f rapor/foto_deneme/sonuc.json ]; then cat rapor/foto_deneme/sonuc.json >> "$GITHUB_STEP_SUMMARY"; fi
