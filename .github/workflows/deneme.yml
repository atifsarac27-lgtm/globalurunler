name: Site erişim denemesi

# "Run workflow" düğmesiyle elle başlatılır. Kendiliğinden çalışmaz.
on:
  workflow_dispatch:

jobs:
  deneme:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Dosyaları al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tarayıcıyı kur
        run: |
          pip install playwright==1.49.1
          playwright install --with-deps chromium

      - name: Denemeyi çalıştır
        run: python deneme.py

      - name: Sonuçları yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deneme-sonuclari
          path: sonuc/
          retention-days: 14
